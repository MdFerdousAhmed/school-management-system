# Render.com Blueprint — deploys the app on the Free tier with MongoDB Atlas
services:
  - type: web
    name: student-management-system
    runtime: node
    plan: free
    region: oregon

    buildCommand: |
      npm install --prefix server
      npm install --prefix client
      npm run build --prefix client

    startCommand: node server/server.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_NAME
        value: studentsdb
      - key: MONGODB_URI
        sync: false
